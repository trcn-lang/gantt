<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban par Équipe</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --bleu-france:#000091;
    --bleu-975:#ECECFE;
    --texte:#161616;
    --texte-mention:#666666;
    --bordure:#DDDDDD;
    --fond:#FFFFFF;
    --fond-alt:#F6F6F6;
    --st-faire:#929292;
    --st-encours:#0063CB;
    --st-termine:#18753C;
    --label-w:200px;
    --col-w:300px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Marianne",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    color:var(--texte);
    background:var(--fond);
    font-size:14px;
  }

  .app{display:flex;flex-direction:column;height:100vh}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:12px 16px;border-bottom:1px solid var(--bordure);
    flex-wrap:wrap;
  }
  .topbar h1{font-size:18px;font-weight:700;color:var(--bleu-france);}
  .meta{font-size:12px;color:var(--texte-mention)}

  .legende{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .legende .item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--texte-mention)}
  .legende .puce{width:12px;height:12px;border-radius:3px;flex:0 0 auto}

  .toolbar{
    padding:12px 16px;border-bottom:1px solid var(--bordure);
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .toolbar select{
    padding:6px 10px;border:1px solid var(--bordure);border-radius:4px;font-size:13px;background:#fff;
  }
  .toolbar label{font-size:12px;color:var(--texte-mention);font-weight:600}

  /* ========== FILTRES CHIPS (Section / Projet) ========== */
  .filter-section{
    padding:12px 16px;border-bottom:1px solid var(--bordure);
    display:flex;flex-direction:column;gap:10px;
  }
  .filter-row{display:flex;gap:10px;align-items:flex-start}
  .filter-row-label{
    font-size:12px;font-weight:700;color:var(--texte);white-space:nowrap;
    padding-top:6px;flex-shrink:0;min-width:52px;
  }
  .filter-chips{
    display:flex;flex-wrap:wrap;gap:6px;flex:1;
  }
  .filter-chip{
    display:inline-flex;align-items:center;
    padding:5px 12px;border-radius:16px;
    border:1px solid var(--bordure);background:#fff;color:var(--texte);
    font-size:12px;font-weight:500;cursor:pointer;
    transition:background 0.15s,color 0.15s,border-color 0.15s;
    white-space:nowrap;
  }
  .filter-chip:hover{border-color:var(--bleu-france);background:var(--bleu-975)}
  .filter-chip.active{
    background:var(--bleu-france);border-color:var(--bleu-france);color:#fff;font-weight:600;
  }
  .filter-chip.active:hover{background:#1212a8}
  .filter-chips-empty{font-size:12px;color:var(--texte-mention);font-style:italic;padding-top:6px}


  .btn{
    padding:8px 16px;background:var(--bleu-france);color:#fff;border:none;
    border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;transition:background 0.2s;
  }
  .btn:hover{background:#0056b3}
  .btn-danger{background:#CE0500}
  .btn-danger:hover{background:#a80400}
  .btn-cancel{background:#ccc;color:#000}
  .btn-cancel:hover{background:#aaa}

  .dates-duree-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .dates-duree-row > div{flex:1;min-width:100px}
  .incompressible-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;padding-bottom:6px;cursor:pointer;color:var(--texte)}
  .incompressible-label input{cursor:pointer;width:14px;height:14px}

  .cascade-recap-line{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--bordure);font-size:12px}
  .cascade-recap-line:last-child{border-bottom:none}
  .cascade-recap-line .nom-element{font-weight:600;flex:1}
  .cascade-recap-line .dates-shift{color:var(--texte-mention);white-space:nowrap;font-size:11px}
  .cascade-recap-line.dim{opacity:0.6}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;color:#fff}
  .badge.shift{background:var(--critique)}
  .badge.absorbe{background:var(--st-termine)}
  .badge.fixe{background:var(--texte-mention)}

  .scroll{flex:1;overflow:auto;position:relative}

  .matrix{
    display:grid;
    grid-template-columns:var(--label-w) repeat(var(--n-cols,3), minmax(var(--col-w), 1fr));
    align-content:start;
    min-width:fit-content;
  }

  .corner{
    position:sticky;top:0;left:0;z-index:6;
    background:var(--fond);border-right:1px solid var(--bordure);border-bottom:1px solid var(--bordure);
    padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--texte-mention);
    height:56px;flex-shrink:0;
  }

  .col-header{
    position:sticky;top:0;z-index:5;
    background:var(--fond);border-bottom:1px solid var(--bordure);border-left:1px solid var(--bordure);
    height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .col-header .nom{font-size:13px;font-weight:700}
  .col-header .count{
    font-size:11px;color:#fff;background:var(--texte-mention);border-radius:10px;padding:1px 8px;
  }

  .row-label{
    position:sticky;left:0;z-index:4;
    background:var(--bleu-975);border-right:1px solid var(--bordure);border-bottom:1px solid var(--bordure);
    padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;
    min-height:80px;
  }
  .row-label.non-assigne{background:var(--fond-alt)}
  .row-label .nom{font-size:13px;font-weight:700;color:var(--bleu-france)}
  .row-label.non-assigne .nom{color:var(--texte-mention);font-style:italic}
  .row-label .count{font-size:11px;color:var(--texte-mention)}

  .cell{
    border-bottom:1px solid var(--bordure);border-left:1px solid var(--bordure);
    padding:8px;display:flex;flex-direction:column;gap:8px;min-height:80px;
    transition:background 0.15s;
  }
  .cell.drag-over{background:var(--bleu-975)}

  .card{
    background:#fff;border:1px solid var(--bordure);border-left:4px solid var(--st-faire);
    border-radius:6px;padding:8px 10px;cursor:grab;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);transition:box-shadow 0.15s, transform 0.15s;
  }
  .card:hover{box-shadow:0 3px 8px rgba(0,0,0,0.12);transform:translateY(-1px)}
  .card.dragging{opacity:0.4}
  .card.st-encours{border-left-color:var(--st-encours)}
  .card.st-termine{border-left-color:var(--st-termine)}
  .card .titre{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3}
  .card .badge-proj{
    display:inline-block;font-size:10px;color:var(--bleu-france);background:var(--bleu-975);
    border-radius:10px;padding:1px 8px;margin-bottom:4px;
  }
  .card .dep-line{
    font-size:11px;color:var(--texte);line-height:1.3;margin-bottom:3px;
    display:flex;gap:5px;align-items:baseline;
  }
  .card .dep-line .puce{flex:0 0 auto;font-size:9px}
  .card .dep-line.retard-subit{color:#CE0500;font-weight:600}
  .card .dep-line.retard-provoque{color:#B34000;font-weight:600}
  .card .echeance-badge{
    display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;
    border-radius:10px;margin-bottom:6px;
  }
  .card .echeance-badge.retard{background:#CE0500;color:#fff}
  .card .echeance-badge.avenir{background:var(--fond-alt);color:var(--texte-mention);border:1px solid var(--bordure)}
  .card .commentaire{
    font-size:11px;color:var(--texte-mention);font-style:italic;margin-bottom:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .dates{font-size:11px;color:var(--texte-mention);display:flex;align-items:center;gap:4px}

  .card-footer{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .card-footer .dates{margin:0}
  .card-actions-indicateurs{
    display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  .indicateur-action{
    display:flex;align-items:center;gap:3px;font-size:11px;color:var(--texte-mention);
  }
  .indicateur-action.termine{color:var(--st-termine)}


  .btn-add-cell{
    background:none;border:1px dashed var(--bordure);color:var(--texte-mention);
    border-radius:4px;padding:6px;font-size:12px;cursor:pointer;text-align:center;
  }
  .btn-add-cell:hover{background:var(--fond-alt);border-color:var(--bleu-france);color:var(--bleu-france)}

  .modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;z-index:1000;
  }
  .modal-overlay.active{display:flex}
  .modal{
    background:#fff;border-radius:8px;padding:24px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
  }
  .modal h2{font-size:18px;margin-bottom:16px;color:var(--bleu-france)}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
  .form-group input,.form-group textarea,.form-group select{
    width:100%;padding:8px 12px;border:1px solid var(--bordure);border-radius:4px;font-size:13px;
  }
  .form-group input[readonly]{background:var(--fond-alt);color:var(--texte-mention)}
  .form-group textarea{resize:vertical;min-height:70px}
  .form-actions{display:flex;gap:8px;margin-top:24px;justify-content:space-between}
  .form-actions .right{display:flex;gap:8px}

  .info-box{
    background:#FFF3CD;border:1px solid #FFC107;border-radius:4px;padding:12px;margin-bottom:16px;font-size:12px;
    color:#856404;line-height:1.4;
  }
  .info-box.warning{background:#F8D7DA;border-color:#F5C6CB;color:#721C24}

  .multi-select{
    border:1px solid var(--bordure);border-radius:4px;padding:8px;max-height:150px;
    overflow-y:auto;overflow-x:hidden;width:100%;box-sizing:border-box;
  }
  .multi-select-item{
    display:grid;
    grid-template-columns:16px 1fr;
    align-items:start;
    gap:8px;
    padding:6px 8px;
    cursor:pointer;
    border-radius:3px;
    width:100%;
    box-sizing:border-box;
  }
  .form-group .multi-select-item{display:grid}
  .multi-select-item:hover{background:var(--fond-alt)}
  .multi-select-item input[type="checkbox"]{cursor:pointer;width:16px;height:16px;margin:2px 0 0 0}
  .multi-select-item-text{min-width:0;overflow-wrap:break-word;word-break:normal;line-height:1.35}

  .empty-state{padding:40px;text-align:center;color:var(--texte-mention)}

  /* ========================================================= */
  /* ============  MODALE TÂCHE : LAYOUT 2 COLONNES  =========== */
  /* ========================================================= */

  #modal-tache .modal{
    max-width:900px;
    width:95%;
    max-height:90vh;
    display:flex;
    flex-direction:column;
    padding:24px;
  }

  .modal-tache-body{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:24px;
    flex:1;
    min-height:0; /* nécessaire pour que les enfants puissent scroller */
  }

  .modal-left-column{
    overflow-y:auto;
    overflow-x:hidden;
    padding-right:4px;
    min-width:0;
    min-height:0;
  }

  .modal-right-column{
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--bordure);
    padding-left:24px;
    min-width:0;
    min-height:0;
  }

  .modal-right-column h3{
    margin:0 0 12px 0;
    font-size:14px;
    font-weight:700;
    color:var(--bleu-france);
  }

  .sous-actions-list-wrapper{
    flex:1;
    overflow-y:auto;
    margin-bottom:12px;
    min-height:60px;
  }

  #modal-tache .form-actions{
    margin-top:20px;
    flex-shrink:0;
  }

  /* Responsive : empile les 2 colonnes sur petit écran */
  @media (max-width: 768px){
    #modal-tache .modal{
      max-width:95%;
    }
    .modal-tache-body{
      grid-template-columns:1fr;
      overflow-y:auto;
    }
    .modal-left-column{
      overflow-y:visible;
      max-height:none;
    }
    .modal-right-column{
      border-left:none;
      border-top:1px solid var(--bordure);
      padding-left:0;
      padding-top:16px;
      min-height:200px;
    }
  }

  /* ========================================================= */
  /* ==================  SOUS-ACTIONS (ACTIONS)  ================ */
  /* ========================================================= */

  .sous-action-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    background:var(--fond-alt);
    border-radius:4px;
    margin-bottom:6px;
    border-left:3px solid var(--bleu-france);
  }
  .sous-action-item:hover{background:var(--bleu-975)}

  .sous-action-item input[type="checkbox"]{
    cursor:pointer;
    width:18px;
    height:18px;
    flex-shrink:0;
    accent-color:var(--bleu-france);
  }

  .sous-action-nom{
    flex:1;
    font-size:13px;
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .sous-action-equipe{
    font-size:11px;
    color:var(--texte-mention);
    max-width:90px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex-shrink:0;
  }

  .sous-action-actions{
    display:flex;
    gap:2px;
    flex-shrink:0;
  }

  .btn-edit-sous-action,
  .btn-delete-sous-action{
    background:none;
    border:none;
    color:var(--texte-mention);
    cursor:pointer;
    padding:3px 5px;
    font-size:12px;
    border-radius:3px;
    line-height:1;
  }
  .btn-edit-sous-action:hover{background:var(--bordure);color:var(--bleu-france)}
  .btn-delete-sous-action:hover{background:#f5e6e6;color:#CE0500}

  .sous-action-empty{
    padding:16px 8px;
    color:var(--texte-mention);
    font-size:12px;
    text-align:center;
  }

  .sous-action-input-create{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--bleu-france);
    border-radius:4px;
    font-size:13px;
    font-family:inherit;
  }
  .sous-action-input-create:focus{
    outline:none;
    box-shadow:0 0 0 3px rgba(0,0,145,0.12);
  }

  .btn-add-sous-action{
    width:100%;
    padding:10px;
    background:var(--fond);
    border:1px dashed var(--bordure);
    color:var(--texte-mention);
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    transition:all 0.15s;
  }
  .btn-add-sous-action:hover{
    border-color:var(--bleu-france);
    color:var(--bleu-france);
    background:var(--bleu-975);
  }

  #modal-sous-action .modal{max-width:440px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Kanban par Équipe</h1>
    <div style="display:flex;gap:20px;align-items:center;flex:1;">
      <div class="legende" id="legende"></div>
      <div class="meta" id="meta">Chargement…</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="btn-add-tache">+ Tâche</button>
    <span style="margin-left:auto;font-size:12px;color:var(--texte-mention)" id="status"></span>
  </div>

  <!-- FILTRES SECTION ET PROJET -->
  <div class="filter-section">
    <div class="filter-row">
      <span class="filter-row-label">Section :</span>
      <div class="filter-chips" id="filter-sections-chips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-row-label">Projet :</span>
      <div class="filter-chips" id="filter-projets-chips"></div>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div class="matrix" id="matrix"></div>
  </div>
</div>

<!-- MODALE TACHE (création + édition) — Layout 2 colonnes -->
<div class="modal-overlay" id="modal-tache">
  <div class="modal">
    <h2 id="modal-tache-title">Nouvelle Tâche</h2>

    <input type="hidden" id="field-tache-id">

    <div class="modal-tache-body">

      <!-- ============ COLONNE GAUCHE : Champs de la tâche ============ -->
      <div class="modal-left-column">

        <div id="info-preds" class="info-box" style="display:none;"></div>
        <div id="info-blocked" class="info-box warning" style="display:none;"></div>

        <div class="form-group"><label>Tâche *</label><input type="text" id="field-tache-nom" placeholder="ex: Publication liste"></div>
        <div class="form-group"><label>Projet *</label><select id="field-tache-projet"></select></div>
        <div class="form-group"><label>Date début *</label><input type="date" id="field-tache-debut"></div>
        <div class="form-group dates-duree-row">
          <div><label>Date fin</label><input type="date" id="field-tache-fin"></div>
          <div><label>Durée (j. ouvrés)</label><input type="number" id="field-tache-duree" min="1"></div>
          <label class="incompressible-label"><input type="checkbox" id="field-tache-incompressible"> Incompressible</label>
        </div>
        <div class="form-group"><label>Équipe</label><select id="field-tache-equipe"></select></div>
        <div class="form-group"><label>Statut</label><select id="field-tache-statut"></select></div>

        <div class="form-group">
          <label>Prédécesseurs (tâches dont dépend celle-ci)</label>
          <div class="multi-select" id="field-tache-predecesseurs"></div>
        </div>

        <div class="form-group">
          <label>Livrable(s) déclencheur(s) (jalons dont dépend cette tâche)</label>
          <div class="multi-select" id="field-tache-jalons-declencheurs"></div>
        </div>

        <div class="form-group"><label>Commentaires</label><textarea id="field-tache-comments" placeholder="Notes optionnelles"></textarea></div>

      </div>

      <!-- ============ COLONNE DROITE : Sous-actions ============ -->
      <div class="modal-right-column">
        <h3>Sous-Actions</h3>

        <div class="sous-actions-list-wrapper" id="sous-actions-list"></div>

        <div id="sous-action-create-area">
          <button type="button" class="btn-add-sous-action" id="btn-add-sous-action">
            + Ajouter une sous-action
          </button>
        </div>
      </div>

    </div>

    <div class="form-actions">
      <button class="btn btn-danger" id="btn-delete-tache" style="display:none" onclick="deleteTache()">Supprimer</button>
      <div class="right">
        <button class="btn btn-cancel" onclick="closeModal('modal-tache')">Annuler</button>
        <button class="btn" id="btn-save-tache" onclick="saveTache()">Créer</button>
      </div>
    </div>
  </div>
</div>

<!-- MODALE CASCADE -->
<div class="modal-overlay" id="modal-cascade">
  <div class="modal" style="max-width:520px;">
    <h2 id="cascade-titre">Impacts calendaires</h2>
    <div id="cascade-recap"></div>
    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-cancel" onclick="annulerCascade()">Annuler</button>
      <button class="btn" id="btn-confirmer-cascade" onclick="confirmerCascade()">Confirmer</button>
    </div>
  </div>
</div>

<!-- MODALE SOUS-ACTION (édition / suppression) -->
<div class="modal-overlay" id="modal-sous-action">
  <div class="modal">
    <h2 id="modal-sous-action-title">Modifier une sous-action</h2>

    <input type="hidden" id="field-sous-action-id">
    <input type="hidden" id="field-sous-action-tache">

    <div class="form-group">
      <label>Nom *</label>
      <input type="text" id="field-sous-action-nom" maxlength="100" placeholder="ex: Validation RH">
    </div>

    <div class="form-group">
      <label>Statut</label>
      <select id="field-sous-action-statut">
        <option>À faire</option>
        <option>En cours</option>
        <option>Terminé</option>
      </select>
    </div>

    <div class="form-group">
      <label>Équipe</label>
      <select id="field-sous-action-equipe">
        <option value="">-- Aucun --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Commentaires</label>
      <textarea id="field-sous-action-commentaires" placeholder="Notes spécifiques..."></textarea>
    </div>

    <div class="form-actions">
      <button class="btn btn-danger" id="btn-delete-sous-action" style="display:none" onclick="deleteSousAction()">Supprimer</button>
      <div class="right">
        <button class="btn btn-cancel" onclick="closeModal('modal-sous-action')">Annuler</button>
        <button class="btn" id="btn-save-sous-action" onclick="saveSousAction()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script>
const STATUTS = [
  {nom:"À faire",   cls:"st-faire",    couleur:"var(--st-faire)"},
  {nom:"En cours",  cls:"st-encours",  couleur:"var(--st-encours)"},
  {nom:"Terminé",   cls:"st-termine",  couleur:"var(--st-termine)"},
];
let NON_ATTRIBUE_ID = null;


function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}
function statutInfo(s){
  return STATUTS.find(x=>norm(x.nom)===norm(s)) || STATUTS[0];
}
function cssVarValue(v){
  return getComputedStyle(document.documentElement).getPropertyValue(v.replace("var(","").replace(")","").trim())||v;
}
function parseDate(v){
  if(v===null||v===undefined||v==="") return null;
  if(typeof v==="number") return new Date(v*1000);
  const d=new Date(String(v).trim());
  return isNaN(d.getTime())?null:d;
}
function dayIndex(v){
  const d=parseDate(v);
  return d?Math.floor(d.getTime()/86400000):null;
}
function refId(v){
  if(Array.isArray(v)) return v[1];
  return v;
}
function resolveRef(table, id, col){
  const rid=refId(id);
  if(rid===null||rid===undefined) return null;
  const ligne=table.find(row=>row.id===rid);
  return ligne?ligne[col]:null;
}
function fmtJJMM(v){
  const d=parseDate(v);
  if(!d) return "";
  return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0");
}
function toDateInput(v){
  const d=parseDate(v);
  if(!d) return "";
  const jj=String(d.getUTCDate()).padStart(2,"0");
  const mm=String(d.getUTCMonth()+1).padStart(2,"0");
  return `${d.getUTCFullYear()}-${mm}-${jj}`;
}
// ✅ Jours fériés français (fixes + mobiles calculés automatiquement, valable toute année)
function datePaques(annee){
  // Algorithme de Meeus/Jones/Butcher
  const a = annee % 19;
  const b = Math.floor(annee / 100);
  const c = annee % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mois = Math.floor((h + l - 7 * m + 114) / 31);
  const jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(annee, mois - 1, jour);
}

function joursFeriesAnnee(annee){
  const paques = datePaques(annee);
  const addJours = (date, n) => { const d = new Date(date); d.setDate(d.getDate() + n); return d; };
  const cles = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  const feries = [
    new Date(annee, 0, 1),    // Jour de l'an
    addJours(paques, 1),      // Lundi de Pâques
    new Date(annee, 4, 1),    // Fête du travail
    new Date(annee, 4, 8),    // Victoire 1945
    addJours(paques, 39),     // Ascension
    addJours(paques, 50),     // Lundi de Pentecôte
    new Date(annee, 6, 14),   // Fête nationale
    new Date(annee, 7, 15),   // Assomption
    new Date(annee, 10, 1),   // Toussaint
    new Date(annee, 10, 11),  // Armistice 1918
    new Date(annee, 11, 25),  // Noël
  ];
  return new Set(feries.map(cles));
}

const CACHE_FERIES = {};
function estFerie(date){
  const annee = date.getFullYear();
  if(!CACHE_FERIES[annee]) CACHE_FERIES[annee] = joursFeriesAnnee(annee);
  const cle = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
  return CACHE_FERIES[annee].has(cle);
}

function joursOuvres(d1, d2){
  let n=0;
  const cur=new Date(d1);
  while(cur<=d2){
    const j=cur.getDay();
    if(j!==0 && j!==6 && !estFerie(cur)) n++;
    cur.setDate(cur.getDate()+1);
  }
  return n;
}

// Utilitaires jours ouvrés pour la propagation PERT (chemin critique)
function estJourOuvre(date){
  const j=date.getDay();
  return j!==0 && j!==6 && !estFerie(date);
}
function jourOuvreSuivant(date){
  const d=new Date(date);
  d.setDate(d.getDate()+1);
  while(!estJourOuvre(d)) d.setDate(d.getDate()+1);
  return d;
}
function jourOuvrePrecedent(date){
  const d=new Date(date);
  d.setDate(d.getDate()-1);
  while(!estJourOuvre(d)) d.setDate(d.getDate()-1);
  return d;
}
// Renvoie la date de fin après n jours ouvrés en comptant "date" comme jour 1 (cohérent avec Duree_jours)
function ajouterJoursOuvres(date, n){
  const d=new Date(date);
  let restant=Math.max(1,n)-1;
  while(restant>0){
    d.setDate(d.getDate()+1);
    if(estJourOuvre(d)) restant--;
  }
  return d;
}
// Opération inverse : retrouve la date de début connaissant la fin et la durée en jours ouvrés
function soustraireJoursOuvres(date, n){
  const d=new Date(date);
  let restant=Math.max(1,n)-1;
  while(restant>0){
    d.setDate(d.getDate()-1);
    if(estJourOuvre(d)) restant--;
  }
  return d;
}

let DB={};
let draggedTaskId=null;

// ========== FILTRES SECTION / PROJET ==========
let FILTRES_ACTIFS = {
  sections: new Set(),  // IDs de sections cochées
  projets: new Set()    // IDs de projets cochés
};

let SCHEMA_PARAMETRES = { section: null, type: null, statut: null, equipe: null };

grist.ready({requiredAccess:"full"});

function columnarToRows(data){
  if(!data || typeof data!=="object") return [];
  if(Array.isArray(data)) return data;
  const keys=Object.keys(data);
  if(keys.length===0) return [];
  const firstCol=data[keys[0]];
  if(!Array.isArray(firstCol)) return [];
  const rows=[];
  for(let i=0;i<firstCol.length;i++){
    const row={};
    keys.forEach(k=>row[k]=data[k][i]);
    rows.push(row);
  }
  return rows;
}

// Retire des données en mémoire tout projet archivé (colonne Projets.$Archive
// cochée) ainsi que tout ce qui en dépend (tâches, jalons, sous-actions).
// Identique à ganttv11.html — voir ce fichier pour le commentaire complet.
function exclureProjetsArchives(){
  DB.projets = DB.projets.filter(p => p['$Archive'] !== true);
  const projetsVisiblesIds = new Set(DB.projets.map(p => p.id));
  DB.taches = (DB.taches || []).filter(t => projetsVisiblesIds.has(refId(t.Projet)));
  DB.jalons = (DB.jalons || []).filter(j => projetsVisiblesIds.has(refId(j.Projet)));
  if(DB.actions){
    const tachesVisiblesIds = new Set(DB.taches.map(t => t.id));
    DB.actions = DB.actions.filter(a => tachesVisiblesIds.has(refId(a.Tache)));
  }
}

// ========== DÉPENDANCES / PERT ==========

function getPredecessorTasks(task){
  const raw = task.Predecesseurs;
  if(!raw) return [];
  if(!Array.isArray(raw)) return [];

  // Format Grist pour une liste de références : ['L', id1, id2, ...]
  if(raw[0] === 'L'){
    return raw.slice(1)
      .map(id => DB.taches.find(t => t.id === id))
      .filter(Boolean);
  }
  // Cellule corrompue (ex: ancienne sauvegarde erronée) → on ignore
  if(raw[0] === 'E'){
    console.warn("⚠️ Cellule Predecesseurs corrompue pour la tâche", task.id, "- réenregistrez la tâche pour corriger.");
    return [];
  }
  // Fallback : tableau déjà composé d'IDs bruts
  return raw
    .map(id => (typeof id === 'object' ? id : DB.taches.find(t => t.id === id)))
    .filter(Boolean);
}

function getPredecessorsBlocked(task){
  const preds = getPredecessorTasks(task);
  return preds.filter(pred => {
    const predStatut = resolveRef(DB.parametres, pred.Statut, "Statut");
    return norm(predStatut) !== norm("Terminé");
  });
}

// Liens Livrable : un jalon peut requérir des tâches, une tâche peut être déclenchée par des jalons
function parseListeReference(raw, table){
  if(!raw) return [];
  if(!Array.isArray(raw)) return [];
  if(raw[0] === 'L'){
    return raw.slice(1).map(id => table.find(x => x.id === id)).filter(Boolean);
  }
  if(raw[0] === 'E') return [];
  return raw.map(id => (typeof id === 'object' ? id : table.find(x => x.id === id))).filter(Boolean);
}
function getJalonTachesRequises(jalon){
  return parseListeReference(jalon.Taches_requises, DB.taches);
}
// Décode le format "Choix multiple" de Grist (['L', 'Livrable']) en simple texte
function getJalonTypeTexte(jalon){
  const raw = jalon.Type;
  if(!raw) return "";
  if(Array.isArray(raw)){
    if(raw[0]==='L') return raw[1] || "";
    if(raw[0]==='E') return "";
    return "";
  }
  return raw;
}
function getTacheJalonsDeclencheurs(task){
  return parseListeReference(task.Jalon_declencheur, DB.jalons);
}
function getJalonAtteint(jalon){
  const requises = getJalonTachesRequises(jalon);
  if(requises.length > 0){
    return requises.every(t => norm(resolveRef(DB.parametres, t.Statut, "Statut")) === norm("Terminé"));
  }
  const d = parseDate(jalon.Date);
  return d ? (Date.now() >= d.getTime()) : false;
}
// Jalons-livrables que CETTE tâche conditionne (elle fait partie de leurs Taches_requises)
function getJalonsConditionnesParTache(task){
  return DB.jalons.filter(j => norm(getJalonTypeTexte(j))===norm("Livrable") && getJalonTachesRequises(j).some(t=>t.id===task.id));
}

// Détection de cycle unifiée sur le graphe mixte Tâches + Jalons (liens Livrable)
function getSuccessorsUnifies(nodeKey){
  const [type, idStr] = nodeKey.split(':');
  const id = parseInt(idStr);
  const succ = [];
  if(type === 'T'){
    DB.taches.forEach(t=>{ if(getPredecessorTasks(t).some(p=>refId(p.id||p)===id)) succ.push('T:'+t.id); });
    DB.jalons.forEach(j=>{ if(getJalonTachesRequises(j).some(x=>x.id===id)) succ.push('J:'+j.id); });
  } else {
    DB.taches.forEach(t=>{ if(getTacheJalonsDeclencheurs(t).some(x=>x.id===id)) succ.push('T:'+t.id); });
  }
  return succ;
}
function isDescendantUnifie(startKey, candidateKey, visited){
  visited = visited || new Set();
  if(startKey === candidateKey) return true;
  if(visited.has(startKey)) return false;
  visited.add(startKey);
  for(const succ of getSuccessorsUnifies(startKey)){
    if(isDescendantUnifie(succ, candidateKey, visited)) return true;
  }
  return false;
}

// Vérifie si candidateId est déjà un "successeur" (direct ou indirect) de taskId.
// Si oui, ajouter candidateId comme prédécesseur de taskId créerait un cycle.
function isDescendant(taskId, candidateId, visited){
  visited = visited || new Set();
  if(taskId === candidateId) return true;
  if(visited.has(taskId)) return false;
  visited.add(taskId);
  const successeurs = DB.taches.filter(t => getPredecessorTasks(t).some(p => refId(p.id||p) === taskId));
  for(const succ of successeurs){
    if(isDescendant(succ.id, candidateId, visited)) return true;
  }
  return false;
}

function detectCycles(){
  const visited = new Set();
  const stack = new Set();
  function hasCycle(taskId){
    if(stack.has(taskId)) return true;
    if(visited.has(taskId)) return false;
    visited.add(taskId); stack.add(taskId);
    const task = DB.taches.find(t => t.id === taskId);
    if(task){
      for(const pred of getPredecessorTasks(task)){
        if(hasCycle(refId(pred.id||pred))) return true;
      }
    }
    stack.delete(taskId);
    return false;
  }
  return DB.taches.some(t => hasCycle(t.id));
}

// Retard structurel : une tâche T2 est en retard si un de ses prédécesseurs T1
// a une Date_fin postérieure à la Date_debut de T2 (idem pour un jalon dont une
// Taches_requises finit après la date du jalon). Purement dérivé, aucune écriture Grist.
function calculerRetardsStructurels(){
  const provoque = {}, subit = {};
  function ajouterProvoque(cle,genre,nom){ (provoque[cle]=provoque[cle]||[]).push({genre,nom}); }
  function ajouterSubit(cle,nom){ (subit[cle]=subit[cle]||[]).push(nom); }

  DB.taches.forEach(t=>{
    const finT = parseDate(t.Date_fin);
    if(!finT) return;
    DB.taches.forEach(s=>{
      if(s.id===t.id) return;
      if(!getPredecessorTasks(s).some(p=>refId(p.id||p)===t.id)) return;
      const debutS = parseDate(s.Date_debut);
      if(debutS && finT > debutS){
        ajouterProvoque(`T:${t.id}`,"tache",s.Tache);
        ajouterSubit(`T:${s.id}`,t.Tache);
      }
    });
    DB.jalons.forEach(j=>{
      if(norm(getJalonTypeTexte(j))!==norm("Livrable")) return;
      if(!getJalonTachesRequises(j).some(rt=>rt.id===t.id)) return;
      const dateJ = parseDate(j.Date);
      if(dateJ && finT > dateJ){
        ajouterProvoque(`T:${t.id}`,"jalon",j.Nom);
        ajouterSubit(`J:${j.id}`,t.Tache);
      }
    });
  });
  return {provoque, subit};
}
function getRetardStructurel(genre, id){
  const cle=(genre==="tache"?"T:":"J:")+id;
  const r = RETARDS_STRUCTURELS || {provoque:{},subit:{}};
  return { provoque: r.provoque[cle]||[], subit: r.subit[cle]||[] };
}
let RETARDS_STRUCTURELS = {provoque:{}, subit:{}};

// ========== SOUS-ACTIONS (Table ACTIONS) ==========

function getSousActionsTache(tacheId){
  return DB.actions
    .filter(sa => refId(sa.Tache) === tacheId)
    .sort((a, b) => (a.Ordre || 0) - (b.Ordre || 0));
}

// Calcule le badge d'échéance d'une tâche : "En retard depuis X j" ou "Fin dans X j"
// Retourne null si la tâche est Terminée ou n'a pas de date de fin.
function getEcheanceBadge(tache){
  const statutTexte = resolveRef(DB.parametres, tache.Statut, "Statut");
  if(norm(statutTexte) === norm("Terminé")) return null;

  const dFin = parseDate(tache.Date_fin);
  if(!dFin) return null;

  const aujourdhui = new Date();
  aujourdhui.setHours(0,0,0,0);
  const finNormalisee = new Date(dFin);
  finNormalisee.setHours(0,0,0,0);

  if(finNormalisee < aujourdhui){
    const n = Math.max(0, joursOuvres(finNormalisee, aujourdhui) - 1);
    return { type: "retard", texte: `⏰ En retard depuis ${n} j` };
  } else {
    const n = Math.max(0, joursOuvres(aujourdhui, finNormalisee) - 1);
    return { type: "avenir", texte: `Fin dans ${n} j` };
  }
}

let INIT_EN_COURS = false;
let NON_ATTRIBUE_VERIFIE = false;

// ============================================================================
// DÉTECTION AUTO DU SCHÉMA PARAMETRES + GESTION DES FILTRES SECTION/PROJET
// ============================================================================

function detectParametresSchema(){
  if(!DB.parametres || DB.parametres.length === 0) {
    console.log("❌ DB.parametres vide ou non chargée");
    return;
  }

  function nbValeursRemplies(field){
    return DB.parametres.filter(row => row[field] !== null && row[field] !== undefined && row[field] !== "").length;
  }

  const toutesLesColonnes = new Set();
  DB.parametres.forEach(row => Object.keys(row).forEach(k => toutesLesColonnes.add(k)));

  function trouverMeilleureColonne(predicat){
    const candidats = [...toutesLesColonnes].filter(f => f !== 'id' && predicat(f));
    if(candidats.length === 0) return null;
    if(candidats.length === 1) return candidats[0];
    let meilleur = candidats[0], meilleurScore = nbValeursRemplies(candidats[0]);
    for(const c of candidats.slice(1)){
      const score = nbValeursRemplies(c);
      if(score > meilleurScore){ meilleur = c; meilleurScore = score; }
    }
    return meilleur;
  }

  SCHEMA_PARAMETRES.section = trouverMeilleureColonne(f => /^\$?section\d*$/i.test(f));
  SCHEMA_PARAMETRES.type    = trouverMeilleureColonne(f => /^type[_ ]?projet$/i.test(f) || /^\$?type_?projet\d*$/i.test(f));
  SCHEMA_PARAMETRES.statut  = trouverMeilleureColonne(f => /^\$?statut\d*$/i.test(f));
  SCHEMA_PARAMETRES.equipe  = trouverMeilleureColonne(f => /^\$?(equipe|équipe)\d*$/i.test(f));

  if(!SCHEMA_PARAMETRES.section && [...toutesLesColonnes].includes('$Section2')){
    SCHEMA_PARAMETRES.section = '$Section2';
  }

  console.log("=== DÉTECTION SCHÉMA PARAMETRES (colonne avec le plus de données) ===");
  console.log("Colonnes disponibles:", [...toutesLesColonnes].sort());
  console.log("Schéma final:", SCHEMA_PARAMETRES);
  console.log("==========================================================");
}

function obtenirSectionsUniques(){
  // Garde : s'assurer que les données sont chargées et que le schéma est détecté
  if(!DB.projets || DB.projets.length === 0) return [];
  if(!DB.parametres || DB.parametres.length === 0) return [];
  
  // Utiliser le vrai nom de colonne détecté, ou fallback à "Section" si rien n'a marché
  const colSection = SCHEMA_PARAMETRES.section || "Section";
  
  const vues = new Set();
  const sections = [];
  
  DB.projets.forEach(proj=>{
    const sid = refId(proj.Section);
    if(sid !== null && sid !== undefined && !vues.has(sid)){
      // resolveRef cherche dans DB.parametres la ligne avec cet id,
      // puis retourne le champ spécifié (colSection)
      const nom = resolveRef(DB.parametres, proj.Section, colSection);
      if(nom){
        vues.add(sid);
        sections.push({id:sid, nom});
      }
    }
  });
  return sections;
}

function obtenirProjetsParSection(sectionIds){
  if(sectionIds.size === 0) return [];
  return DB.projets.filter(proj=>sectionIds.has(refId(proj.Section)));
}

function creerChip(label, isActive, onClick){
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "filter-chip" + (isActive ? " active" : "");
  chip.textContent = label;
  chip.onclick = onClick;
  return chip;
}

function populerFiltresSection(){
  const container = document.getElementById("filter-sections-chips");
  if(!container) {
    console.error("❌ Container filter-sections-chips introuvable");
    return;
  }
  
  container.innerHTML = "";
  
  try {
    const sections = obtenirSectionsUniques();
    console.log("📋 Sections obtenues:", sections);
    
    if(sections.length === 0){
      container.innerHTML = '<span class="filter-chips-empty">Aucune section trouvée</span>';
      return;
    }

    sections.forEach(section=>{
      const isActive = FILTRES_ACTIFS.sections.has(section.id);
      const chip = creerChip(section.nom, isActive, ()=>{
        if(FILTRES_ACTIFS.sections.has(section.id)){
          FILTRES_ACTIFS.sections.delete(section.id);
        } else {
          FILTRES_ACTIFS.sections.add(section.id);
        }
        FILTRES_ACTIFS.projets.clear();
        populerFiltresSection();
        populerFiltresProjets();
        construire();
      });
      container.appendChild(chip);
    });
  } catch(e) {
    console.error("❌ Erreur dans populerFiltresSection:", e);
    container.innerHTML = '<span class="filter-chips-empty">Erreur chargement sections</span>';
  }
}

function populerFiltresProjets(){
  const container = document.getElementById("filter-projets-chips");
  container.innerHTML = "";

  const projetsDisponibles = obtenirProjetsParSection(FILTRES_ACTIFS.sections);

  if(FILTRES_ACTIFS.sections.size === 0){
    container.innerHTML = '<span class="filter-chips-empty">Sélectionnez une section</span>';
    return;
  }
  if(projetsDisponibles.length === 0){
    container.innerHTML = '<span class="filter-chips-empty">Aucun projet dans cette section</span>';
    return;
  }

  projetsDisponibles.forEach(proj=>{
    const isActive = FILTRES_ACTIFS.projets.has(proj.id);
    const chip = creerChip(proj.Projet, isActive, ()=>{
      if(FILTRES_ACTIFS.projets.has(proj.id)){
        FILTRES_ACTIFS.projets.delete(proj.id);
      } else {
        FILTRES_ACTIFS.projets.add(proj.id);
      }
      populerFiltresProjets();
      construire();
    });
    container.appendChild(chip);
  });
}

async function init(){
  if(INIT_EN_COURS) return; // évite les appels concurrents (ex: cascade déclenchée par onRecords)
  INIT_EN_COURS = true;
  try{
    document.getElementById("status").textContent="Chargement...";
    DB.projets      = columnarToRows(await grist.docApi.fetchTable("Projets"));
    DB.taches       = columnarToRows(await grist.docApi.fetchTable("Taches"));
    DB.jalons       = columnarToRows(await grist.docApi.fetchTable("Jalons"));
    DB.parametres   = columnarToRows(await grist.docApi.fetchTable("PARAMETRES"));
    DB.actions      = columnarToRows(await grist.docApi.fetchTable("ACTIONS"));
    exclureProjetsArchives();  // ← Retirer les projets archivés + tout ce qui en dépend

    console.log("📊 Données chargées depuis Grist:");
    console.log("   Projets:", DB.projets?.length || 0);
    console.log("   Tâches:", DB.taches?.length || 0);
    console.log("   Paramètres:", DB.parametres?.length || 0);

    // ✅ S'assurer qu'un agent "Non attribué" existe dans PARAMETRES.Equipe —
    // vérifié une seule fois par session pour éviter les doublons via onRecords.
    if(!NON_ATTRIBUE_VERIFIE){
      let nonAttribue = DB.parametres.find(r => norm(r.Equipe) === norm("Non attribué"));
      if(!nonAttribue){
        await grist.docApi.applyUserActions([
          ["AddRecord","PARAMETRES",null,{Equipe:"Non attribué"}]
        ]);
        DB.parametres = columnarToRows(await grist.docApi.fetchTable("PARAMETRES"));
        nonAttribue = DB.parametres.find(r => norm(r.Equipe) === norm("Non attribué"));
      }
      NON_ATTRIBUE_ID = nonAttribue ? nonAttribue.id : null;
      NON_ATTRIBUE_VERIFIE = true;
    } else {
      const nonAttribue = DB.parametres.find(r => norm(r.Equipe) === norm("Non attribué"));
      NON_ATTRIBUE_ID = nonAttribue ? nonAttribue.id : NON_ATTRIBUE_ID;
    }

    detectParametresSchema();
    populateSelects();
    populerFiltresSection();
    populerFiltresProjets();
    construire();
    document.getElementById("status").textContent="✓ Données chargées";
  }catch(e){
    console.error("❌", e);
    document.getElementById("status").textContent="❌ "+e.message;
  }finally{
    INIT_EN_COURS = false;
  }
}

function fillSelect(id, values, placeholder){
  const sel=document.getElementById(id);
  const prev=sel.value;
  sel.innerHTML=`<option value="">${placeholder}</option>`;
  values.forEach(v=>{
    const opt=document.createElement("option");
    opt.value=v.value; opt.textContent=v.label;
    sel.appendChild(opt);
  });
  if(prev) sel.value=prev;
}
function uniq(arr){ return arr.filter((v,i,a)=>a.indexOf(v)===i); }

function fmtJourComplet(v){
  const d=parseDate(v);
  if(!d) return "";
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"});
}

let _dernierChampModifie = null;
function majDepuisDuree(){
  _dernierChampModifie="duree";
  const debut=document.getElementById("field-tache-debut").value;
  const duree=parseInt(document.getElementById("field-tache-duree").value)||0;
  if(debut && duree>0){
    const fin=ajouterJoursOuvres(new Date(debut),duree);
    document.getElementById("field-tache-fin").value=toDateInput(Math.floor(fin.getTime()/1000));
  }
}
function majDepuisFin(){
  _dernierChampModifie="fin";
  const debut=document.getElementById("field-tache-debut").value;
  const fin=document.getElementById("field-tache-fin").value;
  if(debut && fin){
    const n=joursOuvres(new Date(debut),new Date(fin));
    document.getElementById("field-tache-duree").value=n>0?n:"";
  }
}
function majDepuisDebut(){
  const debut=document.getElementById("field-tache-debut").value;
  if(!debut) return;
  if(_dernierChampModifie==="duree"||!_dernierChampModifie) majDepuisDuree();
  else majDepuisFin();
}
function majDuree(){ majDepuisDebut(); }

function openTacheEdit(t){
  const duree=t.Duree_jours||1;

  // ✅ FIX: On lit Date_fin directement si présente (nouvelles tâches).
  // Fallback: reconstruction pour les tâches créées avant ce correctif.
  let finValue = t.Date_fin;
  if(!finValue){
    const debutDate=parseDate(t.Date_debut);
    let finDate=debutDate?new Date(debutDate):null;
    if(finDate && duree>1){
      let restant=duree-1;
      while(restant>0){
        finDate.setDate(finDate.getDate()+1);
        const j=finDate.getDay();
        if(j!==0 && j!==6) restant--;
      }
    }
    finValue = finDate ? Math.floor(finDate.getTime()/1000) : null;
  }

  document.getElementById("field-tache-id").value=t.id;
  document.getElementById("field-tache-nom").value=t.Tache||"";
  document.getElementById("field-tache-projet").value=refId(t.Projet)||"";
  document.getElementById("field-tache-debut").value=toDateInput(t.Date_debut);
  document.getElementById("field-tache-fin").value=finValue?toDateInput(finValue):"";
  document.getElementById("field-tache-duree").value=duree;
  document.getElementById("field-tache-equipe").value=resolveRef(DB.parametres, t.Equipe, "Equipe")||"";
  document.getElementById("field-tache-statut").value=resolveRef(DB.parametres, t.Statut, "Statut")||"";
  document.getElementById("field-tache-comments").value=t.Commentaires||"";
  document.getElementById("modal-tache-title").textContent="Modifier la tâche";
  document.getElementById("btn-save-tache").textContent="Enregistrer";
  document.getElementById("btn-delete-tache").style.display="inline-block";
  document.getElementById("field-tache-incompressible").checked=t.Incompressible===true;

  const preds = getPredecessorTasks(t);
  if(preds.length > 0){
    const predNames = preds.map(p => p.Tache || p).join(", ");
    document.getElementById("info-preds").innerHTML = `📌 Dépend de : <strong>${predNames}</strong>`;
    document.getElementById("info-preds").style.display="block";
  } else {
    document.getElementById("info-preds").style.display="none";
  }

  const blocked = getPredecessorsBlocked(t);
  const jalonsDecl = getTacheJalonsDeclencheurs(t);
  const jalonsNonAtteints = jalonsDecl.filter(j => !getJalonAtteint(j));
  const messagesBlocage = [];
  if(blocked.length > 0){
    messagesBlocage.push(`en attente de : ${blocked.map(p => p.Tache || p).join(", ")}`);
  }
  if(jalonsNonAtteints.length > 0){
    messagesBlocage.push(`livrable(s) non atteint(s) : ${jalonsNonAtteints.map(j => j.Nom).join(", ")}`);
  }
  if(messagesBlocage.length > 0){
    document.getElementById("info-blocked").innerHTML = `⚠️ <strong>BLOQUÉE :</strong> ${messagesBlocage.join(" · ")}`;
    document.getElementById("info-blocked").style.display="block";
  } else {
    document.getElementById("info-blocked").style.display="none";
  }

  populatePredecessorsSelect(refId(t.Projet), preds);
  populateJalonsDeclencheursSelect(refId(t.Projet), jalonsDecl);

  // Sous-actions
  displaySousActionsInModal(t.id);
  resetCreateSousActionArea();

  openModal("modal-tache");
}

async function saveTache(){
  const id=document.getElementById("field-tache-id").value;
  const nom=document.getElementById("field-tache-nom").value.trim();
  const projet_id=parseInt(document.getElementById("field-tache-projet").value);
  const debut=document.getElementById("field-tache-debut").value;
  const fin=document.getElementById("field-tache-fin").value;
  const equipe=document.getElementById("field-tache-equipe").value;
  const statut=document.getElementById("field-tache-statut").value;
  const comments=document.getElementById("field-tache-comments").value.trim();
  const incompressible=document.getElementById("field-tache-incompressible").checked;
  if(!nom || !projet_id || !debut || !fin){ alert("Champs obligatoires : Tâche, Projet, dates"); return; }
  if(new Date(fin)<new Date(debut)){ alert("❌ La date de fin ne peut pas être antérieure à la date de début."); return; }

  const duree=joursOuvres(new Date(debut), new Date(fin));

  try{
    const proj=DB.projets.find(c=>c.id===projet_id);
    if(!proj){ alert("Projet non trouvé"); return; }
    const statutId=findParamId("Statut", statut);
    const equipeId=findAgentId(equipe) || NON_ATTRIBUE_ID;
    const sectionId = refId(proj.Section);
    if(!sectionId){ alert("Section invalide"); return; }

    const checkboxes = document.querySelectorAll("#field-tache-predecesseurs input[type='checkbox']:checked");
    const predecessorIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
    if(id){
      const currentTaskId = parseInt(id);
      for(const predId of predecessorIds){
        if(isDescendant(currentTaskId, predId)){
          alert("❌ Cycle détecté : cette dépendance créerait une boucle. Sélection annulée.");
          return;
        }
      }
    }

    const checkboxesJalons = document.querySelectorAll("#field-tache-jalons-declencheurs input[type='checkbox']:checked");
    const jalonDeclencheurIds = Array.from(checkboxesJalons).map(cb => parseInt(cb.value));
    if(id){
      const currentTaskId = parseInt(id);
      for(const jalonId of jalonDeclencheurIds){
        if(isDescendantUnifie('T:'+currentTaskId, 'J:'+jalonId)){
          alert("❌ Cycle détecté : ce livrable déclencheur créerait une boucle. Sélection annulée.");
          return;
        }
      }
    }

    const ancienneTache = id ? DB.taches.find(t=>t.id===parseInt(id)) : null;
    const nouvelleDateFin = Math.floor(new Date(fin).getTime()/1000);
    const dateFinChangee = ancienneTache && ancienneTache.Date_fin !== nouvelleDateFin;

    const values={
      Section:sectionId, Projet:projet_id, Tache:nom,
      Date_debut:Math.floor(new Date(debut).getTime()/1000),
      Date_fin:nouvelleDateFin,
      Duree_jours:duree, Statut:statutId, Equipe:equipeId,
      Commentaires:comments,
      Predecesseurs:['L',...predecessorIds],
      Jalon_declencheur:['L',...jalonDeclencheurIds],
      Incompressible:incompressible
    };

    if(id){
      await grist.docApi.applyUserActions([["UpdateRecord","Taches",parseInt(id),values]]);
    }else{
      await grist.docApi.applyUserActions([["AddRecord","Taches",null,values]]);
    }
    await init();
    construire();

    // Cascade automatique si Date_fin a changé
    if(dateFinChangee && ancienneTache){
      const tacheMisAJour = DB.taches.find(t=>t.id===parseInt(id));
      if(tacheMisAJour){
        const impacts = calculerCascadeDepuisTache(tacheMisAJour);
        if(impacts.length > 0){
          afficherRecapCascade("tache", tacheMisAJour.Tache, impacts);
          return;
        }
      }
    }
    closeModal("modal-tache");
  }catch(e){ alert("Erreur: "+e.message); console.error(e); }
}

// ============================================================================
// MOTEUR DE CASCADE (identique au Gantt)
// ============================================================================
let LAST_CASCADE_IMPACTS = [];
let LAST_CASCADE_SOURCE  = null;

function calculerCascadeDepuisTache(startTask){
  const projId = refId(startTask.Projet);
  const tasksScope = DB.taches.filter(t=>refId(t.Projet)===projId);
  const jalonsScope = DB.jalons.filter(j=>refId(j.Projet)===projId);
  const byTaskId = {};
  tasksScope.forEach(t=>byTaskId[t.id]=t);

  const impacts = [];
  const finEffective = {};
  finEffective[startTask.id] = parseDate(startTask.Date_fin);
  const visites = new Set([`T:${startTask.id}`]);
  const file    = [`T:${startTask.id}`];

  while(file.length){
    const key = file.shift();
    const [kind, rawId] = key.split(":");
    const currentId = parseInt(rawId);

    if(kind==="T"){
      tasksScope
        .filter(t=>getPredecessorTasks(t).some(p=>{const pid=refId(p.id||p);return pid===currentId;}))
        .forEach(s=>{ if(!visites.has(`T:${s.id}`)) traiterSuccesseurTache(s); });
      jalonsScope
        .filter(j=>norm(getJalonTypeTexte(j))===norm("Livrable"))
        .filter(j=>getJalonTachesRequises(j).some(t=>t.id===currentId))
        .forEach(j=>{ if(!visites.has(`J:${j.id}`)) traiterSuccesseurJalon(j); });
    }
  }

  function traiterSuccesseurTache(s){
    visites.add(`T:${s.id}`);
    const predsIds=getPredecessorTasks(s).map(p=>refId(p.id||p)).filter(pid=>byTaskId[pid]);
    let maxFin=null;
    predsIds.forEach(pid=>{
      const f=finEffective[pid]!==undefined?finEffective[pid]:parseDate(byTaskId[pid].Date_fin);
      if(f&&(!maxFin||f>maxFin)) maxFin=f;
    });
    if(!maxFin){finEffective[s.id]=parseDate(s.Date_fin);file.push(`T:${s.id}`);return;}
    const debutMini=jourOuvreSuivant(maxFin);
    const debutActuel=parseDate(s.Date_debut);
    if(!debutActuel||debutMini<=debutActuel){finEffective[s.id]=parseDate(s.Date_fin);file.push(`T:${s.id}`);return;}
    const deltaJours=joursOuvres(debutActuel,debutMini)-1;
    const dureeActuelle=s.Duree_jours||joursOuvres(parseDate(s.Date_debut),parseDate(s.Date_fin));
    const incompressible=s.Incompressible===true;
    if(!incompressible){
      const nouvelleDuree=dureeActuelle-deltaJours;
      if(nouvelleDuree>=1){
        finEffective[s.id]=parseDate(s.Date_fin);
        impacts.push({genre:"tache",element:s,nom:s.Tache,statut:"absorbe",deltaJours,
          oldDebut:debutActuel,oldFin:parseDate(s.Date_fin),newDebut:debutMini,newFin:parseDate(s.Date_fin),nouvelleDuree});
        return;
      }
    }
    const nouvelleFin=ajouterJoursOuvres(debutMini,dureeActuelle);
    finEffective[s.id]=nouvelleFin;
    impacts.push({genre:"tache",element:s,nom:s.Tache,statut:"shift",deltaJours,
      oldDebut:debutActuel,oldFin:parseDate(s.Date_fin),newDebut:debutMini,newFin:nouvelleFin,nouvelleDuree:dureeActuelle});
    file.push(`T:${s.id}`);
  }

  function traiterSuccesseurJalon(j){
    visites.add(`J:${j.id}`);
    const jalonFixe=j.Important===true;
    const dateJalon=parseDate(j.Date);
    const dateFinSource=finEffective[startTask.id];
    if(!dateJalon||!dateFinSource) return;
    if(dateFinSource<=dateJalon) return;
    const deltaJours=joursOuvres(dateJalon,dateFinSource);
    if(jalonFixe){
      impacts.push({genre:"jalon",element:j,nom:j.Nom,statut:"fixe",deltaJours,oldFin:dateJalon,newFin:dateJalon});
    } else {
      const nouvelleDate=ajouterJoursOuvres(dateFinSource,1);
      impacts.push({genre:"jalon",element:j,nom:j.Nom,statut:"shift",deltaJours,oldFin:dateJalon,newFin:nouvelleDate});
    }
  }

  // Conflits amont
  const nouvelleDateFinSource=parseDate(startTask.Date_fin);
  jalonsScope
    .filter(j=>norm(getJalonTypeTexte(j))===norm("Livrable"))
    .filter(j=>getJalonTachesRequises(j).some(t=>t.id===startTask.id))
    .forEach(j=>{
      const dateJalon=parseDate(j.Date);
      if(!dateJalon||!nouvelleDateFinSource) return;
      if(nouvelleDateFinSource<=dateJalon) return;
      const deltaJours=joursOuvres(dateJalon,nouvelleDateFinSource);
      impacts.push({genre:"jalon",element:j,nom:j.Nom,statut:"conflit",deltaJours,
        detail:`Tâche finit le ${fmtJourComplet(Math.floor(nouvelleDateFinSource.getTime()/1000))} > Jalon le ${fmtJourComplet(Math.floor(dateJalon.getTime()/1000))}`});
    });

  return impacts;
}

function afficherRecapCascade(sourceType, sourceNom, impacts){
  LAST_CASCADE_IMPACTS=impacts;
  LAST_CASCADE_SOURCE={type:sourceType, modal:"modal-tache"};
  const recapDiv=document.getElementById("cascade-recap");
  recapDiv.innerHTML="";
  const conflits=impacts.filter(i=>i.statut==="conflit");
  const cascades=impacts.filter(i=>i.statut!=="conflit");
  const nbShift=cascades.filter(i=>i.statut==="shift").length;
  document.getElementById("cascade-titre").textContent=
    [conflits.length>0?`${conflits.length} conflit(s)`:"",
     cascades.length>0?`${cascades.length} impact(s) à propager`:""]
    .filter(Boolean).join(" · ")||"Impacts calendaires";
  document.getElementById("btn-confirmer-cascade").style.display=nbShift>0?"inline-block":"none";

  function ajouterLigne(impact, estConflit){
    const ligne=document.createElement("div");
    ligne.className="cascade-recap-line"+(impact.statut!=="shift"&&!estConflit?" dim":"");
    if(estConflit) ligne.style.background="#FFF5F5";
    const icone=document.createElement("span");
    icone.textContent=impact.genre==="jalon"?"◆":"▶";
    icone.style.cssText="font-size:10px;flex-shrink:0;"+(estConflit?"color:var(--critique)":"opacity:0.6");
    ligne.appendChild(icone);
    const nom=document.createElement("span");
    nom.className="nom-element";
    nom.textContent=impact.nom;
    ligne.appendChild(nom);
    const info=document.createElement("span");
    info.className="dates-shift";
    if(estConflit){
      info.textContent=impact.detail||"";
    } else if(impact.statut==="shift"){
      const oldD=impact.oldDebut||impact.oldFin;
      const newD=impact.newDebut||impact.newFin;
      if(oldD&&newD) info.textContent=`${fmtJourComplet(Math.floor(oldD.getTime()/1000))} → ${fmtJourComplet(Math.floor(newD.getTime()/1000))}`;
    } else if(impact.statut==="absorbe"){
      info.textContent=`durée réduite à ${impact.nouvelleDuree}j`;
    } else if(impact.statut==="fixe"){
      info.textContent=`reste au ${fmtJourComplet(Math.floor(impact.oldFin.getTime()/1000))}`;
    }
    ligne.appendChild(info);
    const badge=document.createElement("span");
    badge.className="badge "+(estConflit?"conflit":impact.statut);
    badge.style.background=estConflit?"var(--critique)":"";
    badge.textContent=estConflit?"Conflit":impact.statut==="shift"?"Décalé":impact.statut==="absorbe"?"Absorbé":"Fixe";
    ligne.appendChild(badge);
    recapDiv.appendChild(ligne);
  }

  if(conflits.length>0){
    const t=document.createElement("div");
    t.style.cssText="font-size:11px;font-weight:700;color:var(--critique);text-transform:uppercase;letter-spacing:.5px;margin:4px 0 6px 0";
    t.textContent="⚠️ Conflits détectés";
    recapDiv.appendChild(t);
    conflits.forEach(i=>ajouterLigne(i,true));
    if(cascades.length>0){
      const sep=document.createElement("div");
      sep.style.cssText="border-top:1px solid var(--bordure);margin:10px 0 6px 0";
      recapDiv.appendChild(sep);
    }
  }
  if(cascades.length>0){
    const t=document.createElement("div");
    t.style.cssText="font-size:11px;font-weight:700;color:var(--texte-mention);text-transform:uppercase;letter-spacing:.5px;margin:4px 0 6px 0";
    t.textContent="Propagation";
    recapDiv.appendChild(t);
    cascades.forEach(i=>ajouterLigne(i,false));
  }
  openModal("modal-cascade");
}

function annulerCascade(){
  closeModal("modal-cascade");
  if(LAST_CASCADE_SOURCE) closeModal(LAST_CASCADE_SOURCE.modal);
  LAST_CASCADE_IMPACTS=[];
  LAST_CASCADE_SOURCE=null;
}

async function confirmerCascade(){
  const aAppliquer=LAST_CASCADE_IMPACTS.filter(i=>i.statut==="shift");
  try{
    const tachesActions=aAppliquer.filter(i=>i.genre==="tache").map(i=>["UpdateRecord","Taches",i.element.id,{
      Date_debut:Math.floor(i.newDebut.getTime()/1000),
      Date_fin:Math.floor(i.newFin.getTime()/1000)
    }]);
    const jalonsActions=aAppliquer.filter(i=>i.genre==="jalon").map(i=>["UpdateRecord","Jalons",i.element.id,{
      Date:Math.floor(i.newFin.getTime()/1000)
    }]);
    const absorbeActions=LAST_CASCADE_IMPACTS.filter(i=>i.statut==="absorbe").map(i=>["UpdateRecord","Taches",i.element.id,{
      Date_debut:Math.floor(i.newDebut.getTime()/1000),
      Duree_jours:i.nouvelleDuree
    }]);
    await grist.docApi.applyUserActions([...tachesActions,...jalonsActions,...absorbeActions]);
    closeModal("modal-cascade");
    if(LAST_CASCADE_SOURCE) closeModal(LAST_CASCADE_SOURCE.modal);
    await init();
    construire();
  }catch(e){ alert("Erreur lors de la cascade : "+e.message); console.error(e); }
  LAST_CASCADE_IMPACTS=[];
  LAST_CASCADE_SOURCE=null;
}

async function deleteTache(){
  const id=parseInt(document.getElementById("field-tache-id").value);
  if(!id) return;
  if(!confirm("Supprimer cette tâche ?")) return;
  try{
    // Supprime aussi les sous-actions liées
    const sousActionsLiees = getSousActionsTache(id);
    const actions = sousActionsLiees.map(sa => ["RemoveRecord","ACTIONS",sa.id]);
    actions.push(["RemoveRecord","Taches",id]);
    await grist.docApi.applyUserActions(actions);
    closeModal("modal-tache");
    await init();
    construire();
  }catch(e){ alert("Erreur: "+e.message); console.error(e); }
}

async function deplacerTache(taskId, statutNom, equipeId){
  try{
    const statutId=findParamId("Statut", statutNom);
    await grist.docApi.applyUserActions([
      ["UpdateRecord","Taches",taskId,{Statut:statutId, Equipe:equipeId}]
    ]);
    init();
  }catch(e){ alert("Erreur: "+e.message); console.error(e); }
}

/* ---------- Sous-actions : affichage + CRUD ---------- */

function displaySousActionsInModal(tacheId){
  const sousActions = getSousActionsTache(tacheId);
  const container = document.getElementById("sous-actions-list");
  container.innerHTML = "";

  if(sousActions.length === 0){
    container.innerHTML = '<div class="sous-action-empty">Aucune sous-action</div>';
    return;
  }

  sousActions.forEach(sa=>{
    const statutTexte = resolveRef(DB.parametres, sa.Statut, "Statut");
    const equipeTexte = resolveRef(DB.parametres, sa.Equipe, "Equipe") || "Non attribué";

    const item = document.createElement("div");
    item.className = "sous-action-item";

    // Checkbox : coché = Terminé
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = norm(statutTexte) === norm("Terminé");
    checkbox.onchange = async (e) => {
      const newStatut = e.target.checked ? "Terminé" : "À faire";
      const newStatutId = findParamId("Statut", newStatut);
      try{
        await grist.docApi.applyUserActions([
          ["UpdateRecord","ACTIONS", sa.id, {Statut:newStatutId}]
        ]);
        await init();
        displaySousActionsInModal(tacheId);
      }catch(err){ alert("Erreur: "+err.message); }
    };
    item.appendChild(checkbox);

    // Nom (occupe l'espace disponible)
    const nomSpan = document.createElement("span");
    nomSpan.className = "sous-action-nom";
    nomSpan.textContent = sa.Nom;
    nomSpan.title = sa.Nom;
    item.appendChild(nomSpan);

    // Équipe ("Non attribué" si vide)
    const equipeSpan = document.createElement("span");
    equipeSpan.className = "sous-action-equipe";
    equipeSpan.textContent = equipeTexte;
    equipeSpan.title = equipeTexte;
    item.appendChild(equipeSpan);

    // Boutons édition / suppression
    const actionsDiv = document.createElement("div");
    actionsDiv.className = "sous-action-actions";

    const btnEdit = document.createElement("button");
    btnEdit.type = "button";
    btnEdit.className = "btn-edit-sous-action";
    btnEdit.textContent = "✏";
    btnEdit.title = "Modifier";
    btnEdit.onclick = () => openSousActionModal(tacheId, sa.id);
    actionsDiv.appendChild(btnEdit);

    const btnDelete = document.createElement("button");
    btnDelete.type = "button";
    btnDelete.className = "btn-delete-sous-action";
    btnDelete.textContent = "🗑";
    btnDelete.title = "Supprimer";
    btnDelete.onclick = async () => {
      if(confirm("Supprimer cette sous-action ?")){
        try{
          await grist.docApi.applyUserActions([["RemoveRecord","ACTIONS", sa.id]]);
          await init();
          displaySousActionsInModal(tacheId);
        }catch(err){ alert("Erreur: "+err.message); }
      }
    };
    actionsDiv.appendChild(btnDelete);

    item.appendChild(actionsDiv);
    container.appendChild(item);
  });
}

// Remet la zone de création dans son état initial (bouton "+ Ajouter")
function resetCreateSousActionArea(){
  const area = document.getElementById("sous-action-create-area");
  area.innerHTML = "";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "btn-add-sous-action";
  btn.id = "btn-add-sous-action";
  btn.textContent = "+ Ajouter une sous-action";
  btn.onclick = () => {
    const tacheId = parseInt(document.getElementById("field-tache-id").value);
    if(!tacheId){
      alert("Enregistrez la tâche d'abord");
      return;
    }
    activateCreateInput(tacheId);
  };
  area.appendChild(btn);
}

// Bascule la zone en input texte inline (Entrée = créer, Échap = annuler)
function activateCreateInput(tacheId){
  const area = document.getElementById("sous-action-create-area");
  area.innerHTML = "";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "sous-action-input-create";
  input.placeholder = "Taper le nom de la sous-action…";
  input.maxLength = 100;

  input.onkeydown = async (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      const nom = input.value.trim();
      if(!nom) return;

      try{
        const existantes = getSousActionsTache(tacheId);
        const ordre = existantes.length + 1;
        const statutId = findParamId("Statut", "À faire");

        await grist.docApi.applyUserActions([
          ["AddRecord","ACTIONS", null, {
            Tache: tacheId,
            Nom: nom,
            Ordre: ordre,
            Statut: statutId
          }]
        ]);

        await init();
        displaySousActionsInModal(tacheId);
        // Réactive un input vierge, focus conservé pour enchaîner les ajouts
        activateCreateInput(tacheId);
      }catch(err){
        alert("Erreur: "+err.message);
      }
    } else if(e.key === "Escape"){
      e.preventDefault();
      resetCreateSousActionArea();
    }
    // Tab : comportement natif du navigateur (sort du champ normalement)
  };

  area.appendChild(input);
  input.focus();
}

/* ---------- Modale d'édition d'une sous-action ---------- */

function openSousActionModal(tacheId, sousActionId){
  const sa = DB.actions.find(x => x.id === sousActionId);
  if(!sa) return;

  document.getElementById("modal-sous-action-title").textContent = "Modifier une sous-action";
  document.getElementById("field-sous-action-id").value = sa.id;
  document.getElementById("field-sous-action-tache").value = tacheId;
  document.getElementById("field-sous-action-nom").value = sa.Nom || "";
  document.getElementById("field-sous-action-statut").value =
    resolveRef(DB.parametres, sa.Statut, "Statut") || "À faire";
  document.getElementById("field-sous-action-equipe").value =
    resolveRef(DB.parametres, sa.Equipe, "Equipe") || "";
  document.getElementById("field-sous-action-commentaires").value = sa.Commentaires || "";
  document.getElementById("btn-delete-sous-action").style.display = "inline-block";
  document.getElementById("btn-save-sous-action").textContent = "Enregistrer";

  openModal("modal-sous-action");
}

async function saveSousAction(){
  const id = document.getElementById("field-sous-action-id").value;
  const tacheId = parseInt(document.getElementById("field-sous-action-tache").value);
  const nom = document.getElementById("field-sous-action-nom").value.trim();
  const statut = document.getElementById("field-sous-action-statut").value;
  const equipe = document.getElementById("field-sous-action-equipe").value;
  const commentaires = document.getElementById("field-sous-action-commentaires").value.trim();

  if(!nom){ alert("Le nom de la sous-action est obligatoire"); return; }

  try{
    const statutId = findParamId("Statut", statut);
    const equipeId = equipe ? findAgentId(equipe) : null;

    const values = {
      Nom: nom,
      Statut: statutId,
      Equipe: equipeId,
      Commentaires: commentaires
    };

    if(id){
      await grist.docApi.applyUserActions([["UpdateRecord","ACTIONS", parseInt(id), values]]);
    }else{
      values.Tache = tacheId;
      values.Ordre = getSousActionsTache(tacheId).length + 1;
      await grist.docApi.applyUserActions([["AddRecord","ACTIONS", null, values]]);
    }

    closeModal("modal-sous-action");
    await init();
    displaySousActionsInModal(tacheId);
  }catch(e){
    alert("Erreur: "+e.message);
  }
}

async function deleteSousAction(){
  const id = parseInt(document.getElementById("field-sous-action-id").value);
  const tacheId = parseInt(document.getElementById("field-sous-action-tache").value);
  if(!id) return;
  if(!confirm("Supprimer cette sous-action ?")) return;

  try{
    await grist.docApi.applyUserActions([["RemoveRecord","ACTIONS", id]]);
    closeModal("modal-sous-action");
    await init();
    displaySousActionsInModal(tacheId);
  }catch(e){
    alert("Erreur: "+e.message);
  }
}

/* ---------- Construction du Kanban matriciel ---------- */

function construire(){
  RETARDS_STRUCTURELS = calculerRetardsStructurels();

  // Déterminer quels projets afficher selon les filtres
  let projetsAffichage = DB.projets;
  if(FILTRES_ACTIFS.projets.size > 0){
    // Si des projets sont cochés, afficher uniquement ceux-là
    projetsAffichage = DB.projets.filter(p=>FILTRES_ACTIFS.projets.has(p.id));
  } else if(FILTRES_ACTIFS.sections.size > 0){
    // Sinon, si des sections sont cochées, afficher les projets de ces sections
    projetsAffichage = DB.projets.filter(p=>{
      const projSectionId = refId(p.Section);
      return FILTRES_ACTIFS.sections.has(projSectionId);
    });
  }
  
  const projetsAffichageIds = new Set(projetsAffichage.map(p=>p.id));

  // "Non attribué" est un agent système dans PARAMETRES.Equipe — placé en
  // dernier dans la liste pour l'affichage.
  const lignes = [...DB.parametres.filter(p=>p.Equipe)].sort((a,b)=>{
    const aNA = norm(a.Equipe)===norm("Non attribué");
    const bNA = norm(b.Equipe)===norm("Non attribué");
    if(aNA && !bNA) return 1;
    if(!aNA && bNA) return -1;
    return 0;
  });

  const matrix = document.getElementById("matrix");
  matrix.innerHTML = "";
  matrix.style.setProperty("--n-cols", STATUTS.length);

  // Coin haut-gauche
  matrix.appendChild(el("div", "corner", "Équipe"));

  // En-têtes de colonnes (statuts)
  STATUTS.forEach(s=>{
    const header = el("div", "col-header");
    header.style.borderTop = `3px solid ${cssVarValue(s.couleur)}`;
    const nomEl = el("span", "nom", s.nom);
    header.appendChild(nomEl);
    matrix.appendChild(header);
  });

  let tachesVisibles = 0;

  lignes.forEach(equipe=>{
    const isNonAssigne = norm(equipe.Equipe) === norm("Non attribué");

    // Tâches de cette ligne, filtrées par projet selon les sélections des filtres
    const tachesLigne = DB.taches.filter(t=>{
      const rid = refId(t.Equipe);
      const matchEquipe = (rid === equipe.id) || (isNonAssigne && (rid===null || rid===undefined || rid===""));
      const matchProjet = projetsAffichageIds.has(refId(t.Projet));
      return matchEquipe && matchProjet;
    });

    // Label de ligne
    const label = el("div", "row-label"+(isNonAssigne?" non-assigne":""));
    label.appendChild(el("span", "nom", equipe.Equipe));
    label.appendChild(el("span", "count", `${tachesLigne.length} tâche${tachesLigne.length>1?"s":""}`));
    matrix.appendChild(label);

    // Une cellule par statut
    STATUTS.forEach(s=>{
      const cell = el("div", "cell");
      cell.dataset.statut = s.nom;
      cell.dataset.equipeId = equipe.id;

      const tachesCell = tachesLigne.filter(t=>{
        const statutTexte = resolveRef(DB.parametres, t.Statut, "Statut");
        return norm(statutInfo(statutTexte).nom) === norm(s.nom);
      });

      tachesCell.forEach(t=>{
        tachesVisibles++;
        const proj = DB.projets.find(c=>c.id===refId(t.Projet));
        const card = el("div", "card "+s.cls);
        card.draggable = true;

        const titre = el("div", "titre", t.Tache);
        card.appendChild(titre);

        // ✅ Badge échéance : "En retard depuis X j" ou "Fin dans X j"
        const echeance = getEcheanceBadge(t);
        if(echeance){
          const badge = el("div", "echeance-badge " + echeance.type, echeance.texte);
          card.appendChild(badge);
        }

        if(proj) card.appendChild(el("span", "badge-proj", proj.Projet));

        // ✅ Dépendances : bloqué par (rouge) puis dépend de (jaune)
        const preds = getPredecessorTasks(t);
        const blocked = getPredecessorsBlocked(t);
        const jalonsDecl = getTacheJalonsDeclencheurs(t);
        const jalonsNonAtteints = jalonsDecl.filter(j => !getJalonAtteint(j));
        const statutTache = resolveRef(DB.parametres, t.Statut, "Statut");
        const jalonsConditionnesNonAtteints = norm(statutTache) !== norm("Terminé")
          ? getJalonsConditionnesParTache(t).filter(j => !getJalonAtteint(j))
          : [];

        if(blocked.length > 0){
          const noms = blocked.map(p => p.Tache || p).join(", ");
          const ligne = el("div", "dep-line");
          ligne.appendChild(el("span","puce","🔴"));
          ligne.appendChild(document.createTextNode(`Bloqué par : ${noms}`));
          card.appendChild(ligne);
        }
        if(jalonsNonAtteints.length > 0){
          const noms = jalonsNonAtteints.map(j => j.Nom).join(", ");
          const ligne = el("div", "dep-line");
          ligne.appendChild(el("span","puce","🔶"));
          ligne.appendChild(document.createTextNode(`En attente de : ${noms}`));
          card.appendChild(ligne);
        }
        if(jalonsConditionnesNonAtteints.length > 0){
          const noms = jalonsConditionnesNonAtteints.map(j => j.Nom).join(", ");
          const ligne = el("div", "dep-line");
          ligne.appendChild(el("span","puce","🔶"));
          ligne.appendChild(document.createTextNode(`Conditionne : ${noms}`));
          card.appendChild(ligne);
        }
        if(preds.length > 0){
          const noms = preds.map(p => p.Tache || p).join(", ");
          const ligne = el("div", "dep-line");
          ligne.appendChild(el("span","puce","🟡"));
          ligne.appendChild(document.createTextNode(`Dépend de : ${noms}`));
          card.appendChild(ligne);
        }

        // ✅ Retard structurel : cette tâche en provoque un / le subit
        const retardT = getRetardStructurel("tache", t.id);
        if(retardT.subit.length > 0){
          const ligne = el("div", "dep-line retard-subit");
          ligne.appendChild(el("span","puce","🔴"));
          ligne.appendChild(document.createTextNode(`En retard (bloquée par ${retardT.subit.join(", ")})`));
          card.appendChild(ligne);
        }
        if(retardT.provoque.length > 0){
          const noms = retardT.provoque.map(x=>x.nom).join(", ");
          const ligne = el("div", "dep-line retard-provoque");
          ligne.appendChild(el("span","puce","⚠️"));
          ligne.appendChild(document.createTextNode(`Met en retard : ${noms}`));
          card.appendChild(ligne);
        }

        // ✅ Commentaire (avant la date), tronqué à 2 lignes
        if(t.Commentaires){
          card.appendChild(el("div", "commentaire", t.Commentaires));
        }

        const dIdx = dayIndex(t.Date_debut);
        const actionsTache = getSousActionsTache(t.id);
        const hasDates = dIdx !== null;
        const hasActions = actionsTache.length > 0;

        if(hasDates || hasActions){
          const footer = el("div", "card-footer");

          if(hasDates){
            const duree = t.Duree_jours||1;
            const finIdx = dayIndex(t.Date_fin);
            const texteDates = finIdx !== null
              ? `${fmtJJMM(t.Date_debut)} - ${fmtJJMM(t.Date_fin)} - ${duree} j`
              : `${fmtJJMM(t.Date_debut)} · ${duree} j`;
            footer.appendChild(el("span", "dates", texteDates));
          } else {
            footer.appendChild(el("span", "dates", ""));
          }

          if(hasActions){
            const nbTerminees = actionsTache.filter(a => {
              const st = resolveRef(DB.parametres, a.Statut, "Statut");
              return norm(st) === norm("Terminé");
            }).length;
            const nbAFaire = actionsTache.length - nbTerminees;

            const indicateurs = el("div", "card-actions-indicateurs");

            if(nbAFaire > 0){
              const indAFaire = el("span", "indicateur-action");
              indAFaire.appendChild(document.createTextNode("☐ " + nbAFaire));
              indicateurs.appendChild(indAFaire);
            }

            if(nbTerminees > 0){
              const indTerminees = el("span", "indicateur-action termine");
              indTerminees.appendChild(document.createTextNode("☑ " + nbTerminees));
              indicateurs.appendChild(indTerminees);
            }

            footer.appendChild(indicateurs);
          }

          card.appendChild(footer);
        }

        card.onclick = () => openTacheEdit(t);

        card.addEventListener("dragstart", (e)=>{
          draggedTaskId = t.id;
          card.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dragend", ()=>{
          card.classList.remove("dragging");
          draggedTaskId = null;
        });

        cell.appendChild(card);
      });

      const btnAdd = el("button", "btn-add-cell", "+ Ajouter");
      btnAdd.onclick = () => openTacheCreate(s.nom, isNonAssigne ? "" : equipe.Equipe);
      cell.appendChild(btnAdd);

      cell.addEventListener("dragover", (e)=>{
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        cell.classList.add("drag-over");
      });
      cell.addEventListener("dragleave", ()=>{
        cell.classList.remove("drag-over");
      });
      cell.addEventListener("drop", (e)=>{
        e.preventDefault();
        cell.classList.remove("drag-over");
        if(draggedTaskId===null) return;
        const equipeId = parseInt(cell.dataset.equipeId);
        deplacerTache(draggedTaskId, cell.dataset.statut, equipeId);
      });

      matrix.appendChild(cell);
    });
  });

  document.getElementById("meta").textContent = `${tachesVisibles} tâche(s) affichée(s) · ${DB.parametres.filter(p=>p.Equipe).length} équipe(s)`;
  rendreLegende();
}

function rendreLegende(){
  const l=document.getElementById("legende");
  l.innerHTML="";
  STATUTS.forEach(s=>{
    const item=el("div","item");
    const puce=el("span","puce"); puce.style.background=cssVarValue(s.couleur);
    item.appendChild(puce);
    item.appendChild(document.createTextNode(s.nom));
    l.appendChild(item);
  });
}

function el(tag,cls,txt){
  const e=document.createElement(cls?"div":tag);
  if(cls)e.className=cls;
  if(txt!==undefined&&txt!==null)e.textContent=txt;
  return e;
}
